name: Bug report
description: Something on the site is broken or looks wrong
labels: [bug]
body:
  - type: input
    id: page
    attributes:
      label: Page address
      placeholder: https://babatundeawo.github.io/career-engine-guide/...
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: iPhone 15, Safari
