name: Build and deploy

# Every push to main publishes the site to GitHub Pages.
# Pull requests run the same build and checks but never publish anything;
# they upload the built site as a downloadable "site-preview" artifact instead.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check that GitHub Pages is switched on
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      # Self-hosted fonts: the WOFF2 files come from the Fontsource npm packages.
      # If this step fails the site still builds and uses system fonts.
      - name: Download fonts
        continue-on-error: true
        run: |
          mkdir -p .fontcache
          cd .fontcache
          npm install --no-audit --no-fund --ignore-scripts --no-package-lock \
            @fontsource-variable/bricolage-grotesque@5 \
            @fontsource-variable/inter@5 \
            @fontsource/instrument-serif@5

      - name: Assemble site into _site
        id: build
        run: |
          SITE_URL=$(python3 .github/scripts/build.py _site)
          echo "SITE_URL=$SITE_URL" >> "$GITHUB_ENV"

      - name: Check pages, links, manifest and service worker
        run: python3 .github/scripts/check_site.py _site

      - name: Check external links (report only)
        uses: lycheeverse/lychee-action@v2
        continue-on-error: true
        with:
          args: --no-progress --accept 200,206,403,429 --exclude-path _site/404.html '_site/**/*.html'
          fail: false

      - name: Lighthouse report (report only)
        uses: treosh/lighthouse-ci-action@v12
        continue-on-error: true
        with:
          configPath: .github/lighthouserc.json
          uploadArtifacts: true

      - name: Upload site as a downloadable artifact (pull requests)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: site-preview
          path: _site
          retention-days: 7

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
